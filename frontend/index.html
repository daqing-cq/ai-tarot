<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
  <title>塔罗秘境</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 四季牌阵悬浮入口：固定在右上角，随时可点；点击时实时核验今天是否为二分二至 -->
  <button id="seasonFloatBtn" class="season-float-btn" type="button" title="四季牌阵 · 仅限春分·夏至·秋分·冬至">
    <span class="season-float-icon">🧭</span>
    <span class="season-float-text">四季牌阵</span>
  </button>

  <!-- 选择牌阵入口：固定在左上角，点击后从左侧滑出牌阵选择侧边栏 -->
  <button id="spreadSelectBtn" class="spread-select-btn" type="button" title="选择牌阵">
    <span class="spread-select-icon">🃏</span>
    <span class="spread-select-text">选择牌阵</span>
  </button>

  <!-- 选择牌阵侧边栏：遮罩 + 滑出面板 -->
  <div class="spread-sidebar-overlay" id="spreadSidebarOverlay"></div>
  <aside class="spread-sidebar" id="spreadSidebar" aria-hidden="true">
    <div class="spread-sidebar-header">
      <h3>🔮 选择牌阵</h3>
      <button class="spread-sidebar-close" id="spreadSidebarClose" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="spread-sidebar-list" id="spreadSidebarList">
      <!-- 由 app.js 动态生成牌阵列表 -->
    </div>
  </aside>

  <!-- 星星背景 -->
  <div class="stars" id="stars"></div>

  <!-- 顶部标题 -->
  <header class="header">
    <div class="logo">🔮</div>
    <h1 class="title">神秘塔罗</h1>
    <p class="subtitle">占卜 · 启示 · 指引</p>
  </header>

  <!-- 主容器 -->
  <main class="main">

    <!-- 问题输入区 -->
    <section class="question-section glass-card">
      <h2>✨ 请将心中的问题告知星辰</h2>
      <textarea
        id="questionInput"
        class="question-input"
        placeholder="你可以问关于爱情、事业、人生方向……或者什么都不问，让塔罗为你揭示当下的能量"
        maxlength="200"
        rows="3"
      ></textarea>
      <div class="char-count"><span id="charCount">0</span>/200</div>
    </section>

    <!-- 当前牌阵展示：默认显示"时间三张"，实际切换通过左上角"选择牌阵"侧边栏完成 -->
    <section class="spread-section">
      <h2>🃏 当前牌阵</h2>
      <div class="current-spread-card" id="currentSpreadCard">
        <!-- 由 app.js 动态填充：图标 / 名称 / 简介 -->
      </div>
      <p class="spread-switch-hint">点击左上角「🃏 选择牌阵」可更换为其他牌阵</p>
    </section>

    <!-- 开始占卜按钮 -->
    <div class="divination-btn-container">
      <button id="divinationBtn" class="divination-btn">
        <span class="btn-orb"></span>
        <span class="btn-text">🃏 抽取塔罗牌</span>
      </button>
    </div>

    <!-- 牌面展示区 -->
    <section class="cards-section" id="cardsSection" style="display:none">
      <h2 class="section-title">🌟 命运之牌</h2>
      <p class="flip-hint" id="flipHint">🔮 轻触卡牌，揭开命运的面纱</p>
      <p class="indicator-note" id="indicatorNote" style="display:none"></p>
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="cards-actions">
        <button id="flipAllBtn" class="flip-all-btn">✨ 翻开全部</button>
        <button id="interpretBtn" class="interpret-btn" disabled>🔮 召唤神谕（AI 解读）</button>
      </div>
    </section>

    <!-- AI解读区 -->
    <section class="interpretation-section glass-card" id="interpretationSection" style="display:none">
      <div class="interpretation-header">
        <div class="oracle-avatar">🔮</div>
        <div>
          <h2>神谕解读</h2>
          <p class="oracle-title">— 星辰传话，命运低语 —</p>
        </div>
      </div>
      <div class="interpretation-text" id="interpretationText">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
      <button id="resetBtn" class="reset-btn" style="display:none">🔄 再次占卜</button>
    </section>

  </main>

  <!-- 底部 -->
  <footer class="footer">
    <p>🌙 塔罗仅供参考，人生由你掌舵 · Powered by 
        <a href="https://www.ta-ku.top" target="_blank" rel="noopener noreferrer" class="footer-link">taku
        </a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
