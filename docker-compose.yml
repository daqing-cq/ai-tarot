version: '3.8'

services:
  tarot-app:
    build: .
    container_name: ai-tarot
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openai}

      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

      # DeepSeek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}

      # Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}

      # Claude
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_BASE_URL=${CLAUDE_BASE_URL:-https://api.anthropic.com}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-20250514}

      # 服务配置
      - PORT=3000
      - NODE_ENV=production
      - FORCE_SEASON_AVAILABLE=${FORCE_SEASON_AVAILABLE:-false}
      - RATE_LIMIT=${RATE_LIMIT:-30}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-2}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}

    volumes:
      - tarot-logs:/app/logs

    networks:
      - tarot-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tarot-net:
    driver: bridge

volumes:
  tarot-logs:
